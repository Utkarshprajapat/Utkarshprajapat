name: Generate GitHub Trophies
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
          
      - name: Generate Trophy
        run: |
          git clone https://github.com/ryo-ma/github-profile-trophy.git
          cd github-profile-trophy
          
          # Patch GraphQL queries to bypass GITHUB_TOKEN 403 restrictions on this profile
          sed -i '/stargazerCount/d' src/Schemas/index.ts
          sed -i 's/node.stargazerCount/0/g' src/user_info.ts
          
          sed -i '/contributionsCollection {/,/}/d' src/Schemas/index.ts
          sed -i 's/userActivity.contributionsCollection.totalCommitContributions/0/g' src/user_info.ts
          
          sed -i '/issues(states: OPEN) {/,/}/d' src/Schemas/index.ts
          sed -i '/issues(states: CLOSED) {/,/}/d' src/Schemas/index.ts
          sed -i 's/userIssue.openIssues.totalCount/0/g' src/user_info.ts
          sed -i 's/userIssue.closedIssues.totalCount/0/g' src/user_info.ts
          
          sed -i '/pullRequests(first: 1) {/,/}/d' src/Schemas/index.ts
          sed -i 's/userPullRequest.pullRequests.totalCount/0/g' src/user_info.ts
          
          sed -i '/dotenv/d' render_svg.ts
          
          sed -i 's/console.log("Starting trophy render...");/console.log("Starting trophy render..."); console.log("Token length:", Deno.env.get("GITHUB_TOKEN1")?.length);/' render_svg.ts
          
          sed -i 's/field: STARGAZERS/field: PUSHED_AT/g' src/Schemas/index.ts
          sed -i 's/ownerAffiliations: OWNER/ownerAffiliations: OWNER, privacy: PUBLIC/g' src/Schemas/index.ts
          
          deno run --allow-net --allow-env --allow-read --allow-write render_svg.ts "Utkarshprajapat" "../github-trophy.svg" "discord" > ../output.txt 2>&1 || true
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          rm -rf github-profile-trophy
          git add -A
          git commit -m "Update GitHub Trophies" || exit 0
          git push

