name: Generate GitHub Trophies
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
          
      - name: Generate Trophy
        run: |
          git clone https://github.com/ryo-ma/github-profile-trophy.git
          cd github-profile-trophy
          
          deno run --allow-net --allow-env --allow-read --allow-write render_svg.ts "Utkarshprajapat" "../github-trophy.svg" "discord" > ../output.txt 2>&1 || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          ls -la > debug.txt
          base64 output.txt > b64.txt
          gh api /repos/Utkarshprajapat/Utkarshprajapat/commits/${{ github.sha }}/comments -f body="$(cat b64.txt)"
          git status
          git commit -m "Update GitHub Trophies" || echo "nothing to commit"
          git push || echo "push failed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            debug.txt
            output.txt
            github-trophy.svg

