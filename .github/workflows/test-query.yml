name: Test GraphQL Query
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test query
        run: |
          cat << "INNER_EOF" > query.json
          {
            "query": "query userInfo($login: String!, $after: String) { user(login: $login) { repositories(first: 100, ownerAffiliations: OWNER, privacy: PUBLIC, orderBy: {direction: DESC, field: STARGAZERS}, after: $after) { totalCount nodes { name stargazers { totalCount } } } } }",
            "variables": { "login": "Utkarshprajapat" }
          }
INNER_EOF
          sed -i "s/\$login/\\\\\$login/g" query.json
          sed -i "s/\$after/\\\\\$after/g" query.json
          curl -s -H "Authorization: bearer ${{ secrets.GITHUB_TOKEN }}" -X POST -d @query.json https://api.github.com/graphql > output.txt
          cat output.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: query-result
          path: output.txt
