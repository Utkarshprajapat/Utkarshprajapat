name: Test GraphQL Query
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Test query
        run: |
          cat << "INNER_EOF" > query.json
          {
            "query": "query userInfo($login: String!, $after: String) { user(login: $login) { repositories(first: 100, ownerAffiliations: OWNER, isFork: false, orderBy: {direction: DESC, field: STARGAZERS}, after: $after) { totalCount nodes { name stargazers { totalCount } } } } }",
            "variables": { "login": "Utkarshprajapat" }
          }
INNER_EOF
          sed -i "s/\$login/\\\\\$login/g" query.json
          sed -i "s/\$after/\\\\\$after/g" query.json
          curl -s -H "Authorization: bearer ${{ secrets.GITHUB_TOKEN }}" -X POST -d @query.json https://api.github.com/graphql > output.txt
          
          # Create a comment on a PR or commit using gh cli
          gh api /repos/Utkarshprajapat/Utkarshprajapat/commits/${{ github.sha }}/comments -f body="$(cat output.txt)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
