name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout github-readme-stats
        uses: actions/checkout@v4
        with:
          repository: anuraghazra/github-readme-stats
          path: github-readme-stats

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch github-readme-stats to bypass restricted fields
        run: |
          cd github-readme-stats
          # Force fetching only public repositories to prevent Resource not accessible by integration
          sed -i 's/ownerAffiliations: OWNER/ownerAffiliations: OWNER, isFork: false/g' src/fetchers/stats.js
          sed -i 's/repositoriesContributedTo(first: 1, contributionTypes: \[COMMIT, ISSUE, PULL_REQUEST, REPOSITORY\]) {/repositoriesContributedTo: followers {/g' src/fetchers/stats.js
          sed -i 's/pullRequests(first: 1) {/pullRequests: followers {/g' src/fetchers/stats.js
          sed -i 's/mergedPullRequests: pullRequests(states: MERGED)/mergedPullRequests: followers/g' src/fetchers/stats.js
          sed -i 's/openIssues: issues(states: OPEN) {/openIssues: followers {/g' src/fetchers/stats.js
          sed -i 's/closedIssues: issues(states: CLOSED) {/closedIssues: followers {/g' src/fetchers/stats.js
          sed -i 's/repositoryDiscussions @include/repositoryDiscussions: followers @include/g' src/fetchers/stats.js
          sed -i 's/repositoryDiscussionComments(onlyAnswers: true) @include/repositoryDiscussionComments: followers @include/g' src/fetchers/stats.js
          # Bypass contributionsCollection as it may be restricted
          sed -i '/commits: contributionsCollection/,/}/d' src/fetchers/stats.js
          sed -i '/reviews: contributionsCollection/,/}/d' src/fetchers/stats.js
          sed -i 's/, $startTime: DateTime = null//g' src/fetchers/stats.js
          sed -i 's/stats.totalCommits = user.commits.totalCommitContributions;/stats.totalCommits = 0;/g' src/fetchers/stats.js
          sed -i 's/user.reviews.totalPullRequestReviewContributions/0/g' src/fetchers/stats.js
          sed -i 's/res.data.errors\[0\].message/res.data.errors\[0\].message + " at " + (res.data.errors\[0\].path || \[\]).join(".") /g' src/fetchers/stats.js

      - name: Install dependencies and start server
        run: |
          cd github-readme-stats
          npm ci
          node express.js &
          PID=$!
          sleep 10
          curl "http://localhost:9000/api?username=Utkarshprajapat&show_icons=true&theme=tokyonight&hide_border=true&hide=issues,prs,contribs,reviews,commits" -o ../github-stats.svg
          curl "http://localhost:9000/api/top-langs/?username=Utkarshprajapat&layout=compact&theme=tokyonight&hide_border=true" -o ../top-langs.svg
          kill $PID
        env:
          PAT_1: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push generated SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg top-langs.svg
          git commit -m "chore: update GitHub stats SVGs" || exit 0
          git push
