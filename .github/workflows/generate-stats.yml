name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout github-readme-stats
        uses: actions/checkout@v4
        with:
          repository: anuraghazra/github-readme-stats
          path: github-readme-stats

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch github-readme-stats to remove private fields
        run: |
          node -e "
            import fs from 'fs';
            const file = 'github-readme-stats/src/fetchers/stats.js';
            let content = fs.readFileSync(file, 'utf8');
            content = content.replace(/repositoriesContributedTo[^}]+}/g, '');
            content = content.replace(/pullRequests\(first: 1\)[^}]+}/g, '');
            content = content.replace(/mergedPullRequests: pullRequests[^}]+}/g, '');
            content = content.replace(/openIssues: issues[^}]+}/g, '');
            content = content.replace(/closedIssues: issues[^}]+}/g, '');
            content = content.replace(/stats\.totalPRs = user\.pullRequests\.totalCount;/g, 'stats.totalPRs = 0;');
            content = content.replace(/stats\.totalPRsMerged = user\.mergedPullRequests\.totalCount;/g, 'stats.totalPRsMerged = 0;');
            content = content.replace(/stats\.mergedPRsPercentage =[\s\S]*?;/g, 'stats.mergedPRsPercentage = 0;');
            content = content.replace(/stats\.totalIssues = user\.openIssues\.totalCount \+ user\.closedIssues\.totalCount;/g, 'stats.totalIssues = 0;');
            content = content.replace(/stats\.contributedTo = user\.repositoriesContributedTo\.totalCount;/g, 'stats.contributedTo = 0;');
            fs.writeFileSync(file, content);
          " --input-type=module

      - name: Install dependencies and start server
        run: |
          cd github-readme-stats
          npm ci
          node express.js &
          sleep 10
          curl "http://localhost:9000/api?username=Utkarshprajapat&show_icons=true&theme=tokyonight&hide_border=true&hide=issues,prs,contribs" -o ../github-stats.svg
          curl "http://localhost:9000/api/top-langs/?username=Utkarshprajapat&layout=compact&theme=tokyonight&hide_border=true" -o ../top-langs.svg
          kill %1
        env:
          PAT_1: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push generated SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg top-langs.svg
          git commit -m "chore: update GitHub stats SVGs" || exit 0
          git push
